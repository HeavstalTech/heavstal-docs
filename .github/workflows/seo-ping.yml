name: SEO IndexNow Ping

on:
  workflow_dispatch:

jobs:
  ping-search-engines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'Docs/package-lock.json'

      - name: Install and Build (Triggers IndexNow)
        working-directory: ./Docs
        run: |
          npm ci
          npm run build
