name: Migrate Package Managers

on:
  workflow_dispatch: # Run manually from the Actions tab

jobs:
  migrate-pkg-managers:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Migration Script
        run: |
          cat << 'EOF' > migrate-pkgs.mjs
          import fs from 'fs';
          import path from 'path';

          function processFile(filePath) {
            let content = fs.readFileSync(filePath, 'utf8');
            let updated = false;

            // Regex to find <Tabs> blocks that contain "npm install <package-names>"
            const installRegex = /<Tabs[^>]*>[\s\S]*?<TabItem label="npm">[\s\S]*?npm install\s+([^`\n]+)[\s\S]*?<\/Tabs>/g;
            
            if (installRegex.test(content)) {
              // 1. Replace the Tabs block with the <PackageManagers> component
              content = content.replace(installRegex, (match, packages) => {
                // packages will capture things like "@heavstal/auth next-auth" or "@heavstal/api"
                return `<PackageManagers pkg="${packages.trim()}" />`;
              });

              // 2. Inject the import statement right after the existing Starlight component imports
              if (!content.includes("from 'starlight-package-managers'")) {
                content = content.replace(
                  /(import \{[^}]*Tabs[^}]*\}[^\n]+)/,
                  `$1\nimport { PackageManagers } from 'starlight-package-managers';`
                );
              }
              
              updated = true;
            }

            if (updated) {
              fs.writeFileSync(filePath, content, 'utf8');
              console.log(`✅ Migrated installations in: ${filePath}`);
            }
          }

          function walkDir(dir) {
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const fullPath = path.join(dir, file);
              if (fs.statSync(fullPath).isDirectory()) {
                walkDir(fullPath);
              } else if (fullPath.endsWith('.mdx')) {
                processFile(fullPath);
              }
            }
          }

          console.log('🔍 Scanning MDX files for installation blocks...');
          walkDir('./src/content/docs');
          console.log('🎉 Done scanning!');
          EOF
          
          node migrate-pkgs.mjs
          rm migrate-pkgs.mjs

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/content/docs/
          
          if git diff --staged --quiet; then
            echo "No installation blocks needed migration."
          else
            git commit -m "chore: migrate installation tabs to starlight-package-managers"
            git push
          fi
